# holo-loop.yml · HOLO-IFACE-01 班次 workflow【候选件, 未激活】
# 候 root 08-30「workflow 解禁」裁决后落 .github/workflows/;
# 过渡期由 OS 端班次代跑(refract + holo-gen 手动/定时), 本文件仅为待颁正本。
# 纪律: 零客户端凭证 — CI 内亦不持私仓读权以外的密钥; 仅提交 holo/ 本目录产物。
name: holo-loop
on:
  schedule:
    - cron: "*/30 * * * *"   # 30 分钟班次
  push:
    paths:
      - "holo/ask/**"         # root 投问即触发折射
  workflow_dispatch: {}

permissions:
  contents: write            # 仅推回 holo/ 产物

jobs:
  refract-and-bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 水晶球折射(ask → answer + crystal 面板)
        run: python3 holo/refract.py

      - name: 八面板投影 + 烘焙 dist + 快照哈希链
        run: python3 holo/holo-gen.py

      - name: 复跑比对(确定性闸: 同 ctx 同代码 ⇒ 同 dist sha256)
        run: |
          sha256sum holo/dist/index.html > /tmp/run1.sha
          python3 holo/holo-gen.py > /dev/null
          sha256sum -c /tmp/run1.sha

      - name: 提交推回(仅 holo/ 产物)
        run: |
          git config user.name "holo-loop"
          git config user.email "holo-loop@qf-os.local"
          git add holo/answer/ holo/holo-state.json holo/dist/
          git diff --cached --quiet && echo "无变化, 不提交" && exit 0
          git commit -m "holo-loop: refract+gen $(cat holo/dist/snapshot.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha256"][:12])')"
          git push

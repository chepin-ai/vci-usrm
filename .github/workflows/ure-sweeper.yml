name: ure-sweeper

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [ure-tick]

concurrency:
  group: ure-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install PyJWT

      - name: Mint GitHub App installation token
        id: app
        env:
          URE_APP_ID: ${{ secrets.URE_APP_ID }}
          URE_APP_KEY: ${{ secrets.URE_APP_KEY }}
          URE_INSTALLATION_ID: ${{ secrets.URE_INSTALLATION_ID }}
        run: |
          python - <<'PY' > /tmp/tok.out
          import json, os, time, urllib.request
          import jwt
          now = int(time.time())
          app_jwt = jwt.encode(
              {"iat": now - 60, "exp": now + 540, "iss": os.environ["URE_APP_ID"]},
              os.environ["URE_APP_KEY"], algorithm="RS256")
          req = urllib.request.Request(
              f"https://api.github.com/app/installations/{os.environ['URE_INSTALLATION_ID']}/access_tokens",
              method="POST",
              headers={"Authorization": f"Bearer {app_jwt}",
                       "Accept": "application/vnd.github+json"})
          print(json.load(urllib.request.urlopen(req))["token"])
          PY
          TOK=$(cat /tmp/tok.out)
          echo "::add-mask::$TOK"
          echo "token=$TOK" >> "$GITHUB_OUTPUT"
          rm -f /tmp/tok.out

      - name: URE tick (dry-run, no LLM)
        env:
          URE_TOKEN: ${{ steps.app.outputs.token }}
          CMD_AUTH: ${{ secrets.CMD_AUTH }}
        run: python scripts/ure_tick.py

      - name: Commit & push state ([skip ci])
        env:
          URE_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name "ure-sweeper[bot]"
          git config user.email "ure-sweeper[bot]@users.noreply.github.com"
          git add ure/
          if git diff --cached --quiet; then
            echo "no state changes; skip push"
          else
            git commit -m "ure: tick $(date -u +%Y%m%d-%H%M%SZ) [skip ci]"
            git remote set-url origin "https://x-access-token:${URE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:main
          fi

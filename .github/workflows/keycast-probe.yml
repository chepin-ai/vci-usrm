name: keycast-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dual-token endpoint matrix (status only)
        run: |
          for S in AI_FULL_PAT LINE_PAT; do
            T=$(curl -s -H "Authorization: Bearer ${!S}" https://api.github.com/rate_limit -o /dev/null -w '%{http_code}')
            R=$(curl -s -H "Authorization: Bearer ${!S}" https://api.github.com/repos/chepin-ai/vci-usrm -o /dev/null -w '%{http_code}')
            K=$(curl -s -H "Authorization: Bearer ${!S}" https://api.github.com/repos/chepin-ai/vci-usrm/keys -o /dev/null -w '%{http_code}')
            U=$(curl -s -H "Authorization: Bearer ${!S}" https://api.github.com/user -o /dev/null -w '%{http_code}')
            echo "MATRIX $S rate_limit=$T repo=$R keys=$K user=$U"
          done
        env:
          AI_FULL_PAT: ${{ secrets.LINE_PAT || secrets.AI_FULL_PAT || github.token }}
          LINE_PAT: ${{ secrets.LINE_PAT || secrets.AI_FULL_PAT || github.token }}

name: zkp-pat-check
on:
  workflow_dispatch:

permissions:
  contents: read   # 只读校验 + artifact 上传，无需写仓

jobs:
  zkp:
    runs-on: ubuntu-latest
    steps:
      - name: ZKP verify AI_FULL_PAT (no value echo)
        env:
          P: ${{ secrets.AI_FULL_PAT }}
        run: |
          set -e
          CODE=$(curl -s -o /tmp/u.json -w "%{http_code}" -H "Authorization: Bearer $P" -H "User-Agent: zkp" https://api.github.com/user)
          echo "http=$CODE"
          if [ "$CODE" = "200" ]; then
            LOGIN=$(python3 -c "import json;print(json.load(open('/tmp/u.json'))['login'])")
            echo "login=$LOGIN"
            echo "PAT_STATUS=VALID" >> $GITHUB_ENV
          else
            echo "PAT_STATUS=INVALID_$CODE" >> $GITHUB_ENV
          fi
      - name: report to chain file
        run: |
          mkdir -p state
          echo "{"ts":"$(date -u +%FT%TZ)","check":"AI_FULL_PAT","status":"${PAT_STATUS:-unknown}","run":"$GITHUB_RUN_ID"}" >> state/zkp.jsonl
      - name: upload
        uses: actions/upload-artifact@v4
        with: {name: zkp-result, path: state/zkp.jsonl}

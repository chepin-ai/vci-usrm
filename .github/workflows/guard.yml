name: guard

# 算法级安全保障（I5/I6 执行件，SPEC-KERNEL-02 不变式机判）：
#   A. 权限面扫描 —— workflow permissions 缺失/过宽、issues 触发缺
#      author_association、pull_request_target 危险用法
#   B. 全仓 HEAD 明文扫描 —— pub_lint K7 规则集对全部文本文件跑密钥/PII
# 违例即 fail；结果写 guard/report-YYYY-MM-DD.md（[skip ci] commit；
# guard/GATE 门禁文件存在则跳过 commit 仅日志）。
# 铁律：密钥只经 secrets/env/Authorization 头；日志零密钥零标识。

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 */24 * * *"   # 每日 :07 值守（错峰）
  workflow_dispatch: {}

concurrency:
  group: guard
  cancel-in-progress: false

permissions:
  # rationale: commit guard/report-*.md back to the repo ([skip ci])
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install PyYAML

      - name: Guard scan (permission surface + full-repo plaintext)
        id: scan
        run: python scripts/guard_scan.py && echo "result=clean" >> "$GITHUB_OUTPUT" || echo "result=violation" >> "$GITHUB_OUTPUT"

      - name: Commit & push report ([skip ci]; skipped when guard/GATE exists)
        if: always()
        env:
          GUARD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "guard[bot]"
          git config user.email "guard[bot]@users.noreply.github.com"
          if [ -f guard/GATE ]; then
            echo "guard/GATE present: skip report commit (log only)"
            exit 0
          fi
          git add guard/
          if git diff --cached --quiet; then
            echo "no report changes; skip push"
          else
            git config --unset-all http.https://github.com/.extraheader || true
            git commit -m "guard: report $(date -u +%Y-%m-%d) [skip ci]"
            git remote set-url origin "https://x-access-token:${GUARD_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase
            git push
          fi

      - name: Enforce gate
        if: always()
        run: |
          if [ "${{ steps.scan.outputs.result }}" != "clean" ]; then
            echo "::error::guard scan violations — see guard/ report"
            exit 1
          fi

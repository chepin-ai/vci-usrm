name: qfa-openssl-decrypt
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: openssl解密+明文落私仓(公仓只见指纹)
        env:
          CMD: ${{ secrets.CMD_AUTH }}
          LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
          LINE_ID: ${{ vars.CI_OPS_LINE_ID }}
        run: |
          pip -q install pyjwt
          python3 - <<'PYEOF'
          import os,json,urllib.request,base64,hashlib,datetime,subprocess
          raw=urllib.request.urlopen('https://raw.githubusercontent.com/chepin-ai/vci-inbox/main/sealed_qfa-ack-20260826.cipher',timeout=20).read()
          open('/tmp/pkg.cipher','wb').write(raw)
          # openssl enc 解密(passphrase=CMD)
          p=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-pbkdf2','-base64','-in','/tmp/pkg.cipher','-pass','env:CMD'],capture_output=True)
          if p.returncode!=0:
              p=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-base64','-in','/tmp/pkg.cipher','-pass','env:CMD'],capture_output=True)
          pt=p.stdout
          ok=p.returncode==0 and len(pt)>0
          fp=hashlib.sha256(pt).hexdigest()[:16] if ok else None
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          print(json.dumps({'decrypt_ok':ok,'bytes':len(pt),'fp':fp,'ts':ts}))
          if ok:
              import jwt,time
              now=int(time.time())
              t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['LINE_ID']},os.environ['LINE_KEY'],algorithm='RS256')
              H={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'}
              inst=json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/app/installations',headers=H)))
              iid=[i['id'] for i in inst if i['account']['login']=='chepin-ai'][0]
              rq=urllib.request.Request(f'https://api.github.com/app/installations/{iid}/access_tokens',method='POST',headers=H); rq.data=b'{}'
              IT=json.load(urllib.request.urlopen(rq))['token']
              def put(repo,path,content,msg):
                  u=f'https://api.github.com/repos/chepin-ai/{repo}/contents/{path}'
                  rq=urllib.request.Request(u,headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
                  sha=None
                  try:
                      x=urllib.request.urlopen(rq); sha=json.loads(x.read().decode()).get('sha')
                  except Exception: pass
                  bd={'message':msg,'content':base64.b64encode(content).decode()}
                  if sha: bd['sha']=sha
                  rq=urllib.request.Request(u,method='PUT',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=json.dumps(bd).encode())
                  try:
                      xr=urllib.request.urlopen(rq); return xr.status
                  except Exception as e: return getattr(e,'code',0)
              r1=put('ci-inbox','mailbox/qfa/ack-20260826.plain',pt,'qfa ack plaintext(私仓金库)')
              print('deliver ci-inbox:',r1)
          PYEOF

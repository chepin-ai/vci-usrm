name: line-scope-probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: line installation repos (名而不值)
        env:
          LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
          LINE_ID: ${{ vars.CI_OPS_LINE_ID }}
        run: |
          pip -q install pyjwt
          python3 - <<'PYEOF'
          import jwt,time,json,os,urllib.request
          now=int(time.time())
          t=jwt.encode({'iat':now-90,'exp':now+540,'iss':os.environ['LINE_ID']},os.environ['LINE_KEY'],algorithm='RS256')
          H={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'}
          inst=json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/app/installations',headers=H)))
          for i in inst:
              print('installation',i['id'],i.get('repository_selection'))
              iid=i['id']
          rq=urllib.request.Request(f'https://api.github.com/app/installations/{iid}/access_tokens',method='POST',headers=H); rq.data=b'{}'
          IT=json.load(urllib.request.urlopen(rq))['token']
          r=urllib.request.Request('https://api.github.com/installation/repositories?per_page=100',headers={'Authorization':'token '+IT,'Accept':'application/vnd.github+json'})
          d=json.load(urllib.request.urlopen(r))
          print('repos:',sorted(x['name'] for x in d.get('repositories',[])))
          PYEOF

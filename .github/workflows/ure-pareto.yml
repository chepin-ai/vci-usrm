name: ure-pareto
# URE 帕累托调度快速原型：--simulate 离线递归证据（猜测策略→不动点）
# 纯 python3+numpy，零 LLM；密钥只经 secrets/env/Authorization 头，绝不落盘。
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [ure-pareto]

concurrency:
  group: ure-pareto
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install numpy PyJWT cryptography

      - name: Mint GitHub App installation token
        # 首选仓内 secrets 铸 token；若 secrets 缺失本步失败时，可改用
        # actions/create-github-app-token@v2 (app-id/private-key/installation-id)
        id: app
        env:
          URE_APP_ID: ${{ secrets.URE_APP_ID }}
          URE_APP_KEY: ${{ secrets.URE_APP_KEY }}
          URE_INSTALLATION_ID: ${{ secrets.URE_INSTALLATION_ID }}
        run: |
          python - <<'PY' > /tmp/tok.out
          import json, os, time, urllib.request
          import jwt
          now = int(time.time())
          app_jwt = jwt.encode(
              {"iat": now - 60, "exp": now + 540, "iss": os.environ["URE_APP_ID"]},
              os.environ["URE_APP_KEY"], algorithm="RS256")
          req = urllib.request.Request(
              f"https://api.github.com/app/installations/{os.environ['URE_INSTALLATION_ID']}/access_tokens",
              method="POST",
              headers={"Authorization": f"Bearer {app_jwt}",
                       "Accept": "application/vnd.github+json"})
          print(json.load(urllib.request.urlopen(req))["token"])
          PY
          TOK=$(cat /tmp/tok.out)
          echo "::add-mask::$TOK"
          echo "token=$TOK" >> "$GITHUB_OUTPUT"
          rm -f /tmp/tok.out

      - name: Run Pareto recursive-evidence simulation
        run: python scripts/pareto_tick.py --simulate

      - name: Commit & push ure/sim/out.json ([skip ci])
        env:
          URE_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name "ure-pareto[bot]"
          git config user.email "ure-pareto[bot]@users.noreply.github.com"
          # checkout 凭证不过界：push 前摘除 actions/checkout 注入的 extraheader
          git config --unset-all http.https://github.com/.extraheader || true
          git add ure/sim/out.json
          if git diff --cached --quiet; then
            echo "no sim output changes; skip push"
          else
            git commit -m "ure-pareto: sim evidence $(date -u +%Y%m%d-%H%M%SZ) [skip ci]"
            git remote set-url origin "https://x-access-token:${URE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            ok=0
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }
              echo "push rejected (attempt $i); rebase and retry"
              sleep $((i*5))
            done
            [ "$ok" = "1" ] || { echo "::error::push failed 3x; leaving for next dispatch"; exit 1; }
          fi

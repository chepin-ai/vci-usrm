name: quafu-watch-01
# EXP-049 自驱闭环(wave-214): 队动自探/务讫自取/S自算/板自报——无人值守硬件事务驱动轨
on:
  workflow_dispatch: {}
  # EVENT-DRIVEN sweep R7: schedule removed per 零定时律 (PIVOT-01) · was: - cron: '23 */12 * * *'
permissions:
  contents: write
concurrency:
  group: quafu-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q --index-url https://pypi.org/simple pyquafu
      - name: watch
        env:
          QUAFU_KEY: ${{ secrets.QUAFU_KEY }}
          LINE_PAT: ${{ secrets.LINE_PAT }}
        run: |
          python3 - <<'PYEOF'
          import os, json, datetime, subprocess, urllib.request, urllib.parse, base64 as B
          ts = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          from quafu import Task, User
          u = User(api_token=os.environ['QUAFU_KEY'])
          bks = u.get_available_backends()
          row = {'ts': ts}
          for n in ('ScQ-P5','Baihua','ScQ-Sim10'):
              b = bks.get(n)
              try:
                import re
                s = str(b)
              except Exception: s='?'
          # 直取表: get_available_backends 打印表, 属性名随版本变——用 retrieve 勘我4务+表字串捕队深
          import io, contextlib
          buf = io.StringIO()
          with contextlib.redirect_stdout(buf):
              bks = u.get_available_backends()
          tbl = buf.getvalue()
          qd = {}
          for ln in tbl.splitlines():
              for n in ('ScQ-P5','Baihua','ScQ-Sim10'):
                  if ln.strip().startswith(n):
                      parts = ln.split()
                      qd[n] = {'status': parts[-2], 'queued': parts[-1]}
          t = Task(u)
          IDS = {'AB':'8D32418037EFFE04','ABp':'8D3241902178F453','ApB':'8D32419033F4DB86','ApBp':'8D3241A006FD2B5A'}
          done = {}
          for tag, tid in IDS.items():
              r = t.retrieve(tid)
              stt = str(r.task_status)
              if stt == 'Completed' and r.counts:
                  done[tag] = r.counts
          row['queue'] = qd; row['hw_done'] = len(done)
          # 遥测落仓
          import pathlib
          pathlib.Path('ci/quafu').mkdir(exist_ok=True)
          with open('ci/quafu/watch.jsonl','a') as f:
              f.write(json.dumps(row, ensure_ascii=False)+'\n')
          verdict = 'HW-HELD'
          if len(done) == 4:
              def E(c):
                  tt = sum(c.values()); return (c.get('00',0)+c.get('11',0)-c.get('01',0)-c.get('10',0))/tt
              S = E(done['AB'])-E(done['ABp'])+E(done['ApB'])+E(done['ApBp'])
              verdict = 'HW-DONE S=%.4f' % S
              json.dump({'S':S,'counts':done,'ts':ts}, open('ci/quafu/EXP049-HW-RESULT.json','w'))
          row['verdict'] = verdict
          subprocess.run(['git','config','user.name','usrm-quafu-watch'])
          subprocess.run(['git','config','user.email','usrm-quafu-watch@users.noreply.github.com'])
          subprocess.run(['git','add','ci/quafu'])
          c = subprocess.run(['git','commit','-q','-m','quafu-watch %s done=%d %s [skip ci]'%(ts,len(done),verdict[:24])],capture_output=True,text=True)
          if c.returncode==0:
              for i in range(4):
                  p = subprocess.run(['git','pull','--rebase','-q'],capture_output=True)
                  q = subprocess.run(['git','push','-q'],capture_output=True)
                  if q.returncode==0: break
                  subprocess.run(['git','rebase','--abort'],capture_output=True)
          print(json.dumps(row, ensure_ascii=False)[:500])
          # 务讫→板自报
          if len(done)==4:
              LP = os.environ.get('LINE_PAT','')
              if LP:
                  body = '# EXP-049 硬件成\nS=%.4f counts见vci-usrm/ci/quafu/EXP049-HW-RESULT.json ——quafu-watch(机)' % S
                  pl = json.dumps({'message':'EXP-049 HW结果 [skip ci]','content':B.b64encode(body.encode()).decode()}).encode()
                  u2 = 'https://api.github.com/repos/chepin-ai/ci-inbox/contents/'+urllib.parse.quote('公告板/exp049-hw-result.md')
                  urllib.request.urlopen(urllib.request.Request(u2,data=pl,method='PUT',
                      headers={'Authorization':'token '+LP,'Accept':'application/vnd.github+json','User-Agent':'quafu-watch'}),timeout=30)
          PYEOF
          # ── 链活看门狗(wave-217, 链死4.2天无人知课): statex末拍>30min且status=running→复臂dispatch ──
          python3 - <<'PYEOF2'
          import os, json, datetime, urllib.request
          H = {'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'chain-watchdog'}
          def api(m,u,data=None):
              r = urllib.request.Request(u,data=data,method=m,headers=H)
              return json.loads(urllib.request.urlopen(r,timeout=30).read())
          stt = api('GET','https://api.github.com/repos/chepin-ai/vci-usrm/contents/si/selfx2-state.json')
          import base64 as B
          st = json.loads(B.b64decode(stt['content']).decode())
          print('chain gen', st.get('gen'), 'status', st.get('status'))
          lg = api('GET','https://api.github.com/repos/chepin-ai/vci-usrm/contents/si/selfx2-log.jsonl')
          last = json.loads(B.b64decode(lg['content']).decode().strip().split('\n')[-1])
          lt = datetime.datetime.strptime(last['ts'],'%Y%m%dT%H%M%SZ').replace(tzinfo=datetime.timezone.utc)
          age = (datetime.datetime.now(datetime.timezone.utc)-lt).total_seconds()
          print('last beat age', int(age), 's')
          runs = api('GET','https://api.github.com/repos/chepin-ai/vci-usrm/actions/workflows/state-excite-usrm-02.yml/runs?per_page=3')
          alive = [r for r in runs['workflow_runs'] if r['status'] in ('queued','in_progress')]
          if age > 1800 and st.get('status')=='running' and not alive:
              api('POST','https://api.github.com/repos/chepin-ai/vci-usrm/actions/workflows/state-excite-usrm-02.yml/dispatches',data=json.dumps({'ref':'main'}).encode())
              print(json.dumps({'watchdog':'REVIVED chain (age %ds)'%age}))
          else:
              print(json.dumps({'watchdog':'ok(no-action)','alive':len(alive)}))
          PYEOF2

# CI-OS 端 OTP 门（T171）：dashboard 按钮经 T2N 直推 inbox → push 触发本 workflow → runner 秒级消费
# 一律 CI-OS 端 CI：会话端零驻留。借范成熟件：actions/setup-python + playwright 官方安装器。
# v4：OTP 会话态以密文形态跨 run 复用——worker 落 inbox/.kimi_session.json.enc（Fernet，
#     钥匙=sha256(bytes.fromhex(CMD_AUTH))，CMD_AUTH 仅经 secrets/env），本 workflow 只 commit .enc。
#     安全宪章 I5：公仓零密钥零标识；明文 .kimi_session.json 由 .gitignore 永久拦截，pub_lint 兜底。
name: otp-gate
on:
  push:
    paths:
      - "inbox/sendcode-*.json"
      - "inbox/otp-*.json"
  workflow_dispatch:
# rationale: 仅回写 inbox/.kimi_session.json.enc 密文态（精确路径 + [skip ci] + K7 pub_lint 闸）
permissions:
  contents: write
concurrency:
  group: otp-gate
  cancel-in-progress: false   # 验证码场景排队消费，不互相顶
jobs:
  consume:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装 Playwright（官方安装器，成熟件）+ 密文件依赖
        run: |
          pip install playwright cryptography PyJWT
          playwright install --with-deps chromium
      - name: 消费 inbox（发码/核码）
        if: github.event_name != 'workflow_dispatch'
        env:
          OTP_PHONE: ${{ secrets.OTP_PHONE }}
          CMD_AUTH: ${{ secrets.CMD_AUTH }}
        run: python3 scripts/otp_gate_worker.py
      - name: 会话复用路径（dispatch 专用：.enc→解密→注入→核活，零短信）
        if: github.event_name == 'workflow_dispatch'
        env:
          CMD_AUTH: ${{ secrets.CMD_AUTH }}
        run: python3 scripts/otp_gate_worker.py --reuse
      # SECURITY (AUDIT-01): inbox/ 明文一律禁止 commit 进公仓（曾泄漏 live refresh_token / 手机号截图）。
      # 唯一例外：inbox/.kimi_session.json.enc（Fernet 密文，零密钥零标识），由下方精确路径回写。
      # 消费态与明文登录态仅经 artifact 传递（私域、1 天留存）。
      - name: 会话态工件（1 天留存，仅供后台工作取用；明文绝不可入 git）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimi-session
          path: inbox/
          retention-days: 1
          if-no-files-found: ignore
      - name: 密文态回写（仅 inbox/.kimi_session.json.enc，[skip ci]；K7 lint 闸 + 现场铸 URE token）
        if: always()
        env:
          URE_APP_ID: ${{ secrets.URE_APP_ID }}
          URE_APP_KEY: ${{ secrets.URE_APP_KEY }}
          URE_INSTALLATION_ID: ${{ secrets.URE_INSTALLATION_ID }}
        run: |
          set -e
          if [ ! -f inbox/.kimi_session.json.enc ]; then echo "no .enc produced; skip"; exit 0; fi
          git config user.name "otp-gate[bot]"
          git config user.email "otp-gate[bot]@users.noreply.github.com"
          # checkout 凭证不过界：push 前摘除 actions/checkout 注入的 extraheader
          git config --unset-all http.https://github.com/.extraheader || true
          git add inbox/.kimi_session.json.enc   # 精确路径，严禁 -A
          if git diff --cached --quiet; then echo ".enc unchanged; skip push"; exit 0; fi
          # K7 明文闸：staged inbox/** 命中明文 session/token/手机号即 exit 1，push 流产
          python3 scripts/pub_lint.py --staged
          # 现场铸 URE 安装 token（私钥仅经 env/Authorization 头，绝不落盘落日志）
          TOK=$(python3 - <<'PY'
          import json, os, time, urllib.request
          import jwt
          now = int(time.time())
          app_jwt = jwt.encode(
              {"iat": now - 60, "exp": now + 540, "iss": os.environ["URE_APP_ID"]},
              os.environ["URE_APP_KEY"], algorithm="RS256")
          req = urllib.request.Request(
              f"https://api.github.com/app/installations/{os.environ['URE_INSTALLATION_ID']}/access_tokens",
              method="POST",
              headers={"Authorization": f"Bearer {app_jwt}",
                       "Accept": "application/vnd.github+json"})
          print(json.load(urllib.request.urlopen(req))["token"])
          PY
          )
          echo "::add-mask::$TOK"
          git commit -m "otp-gate: refresh kimi session .enc $(date -u +%Y%m%d-%H%M%SZ) [skip ci]"
          git remote set-url origin "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git"
          ok=0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }
            echo "push rejected (attempt $i); rebase and retry"
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "::error::push failed 3x; leaving for next run"; exit 1; }

# OUTBOX-LIVE-01 解 A · usrm 线：outbox 由 Actions 直更本仓，poller 改指 raw 即终身免版本卡
# 触发：repository_dispatch(type=usrm-outbox, client_payload.items=[...]) / workflow_dispatch(手摇)
name: outbox-publish
on:
  repository_dispatch:
    types: [usrm-outbox]
  workflow_dispatch:
    inputs:
      items_json:
        description: "DISC-01 件 JSON（对象或数组）"
        required: true
permissions:
  contents: write
concurrency:
  group: usrm-outbox
  cancel-in-progress: false
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 追加+链咬+覆写
        env:
          CMD_AUTH: ${{ secrets.CMD_AUTH }}
          ITEM_JSON: ${{ github.event.client_payload.items_json || github.event.inputs.items_json }}
        run: python3 .ci/outbox_append.py
      - name: 提交回仓 [skip ci]
        run: |
          git config user.name "usrm-bot"; git config user.email "usrm-bot@ci"
          git add outbox/usrm-outbox.json
          git diff --cached --quiet && exit 0
          git commit -m "outbox append $(date -u +%Y%m%dT%H%M%SZ) [skip ci]"
          git pull --rebase && git push

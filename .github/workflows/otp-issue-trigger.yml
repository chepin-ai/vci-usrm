name: otp-issue-trigger
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: write
jobs:
  loop:
    # SECURITY (AUDIT-01): issues trigger must only run for trusted authors
    if: (startsWith(github.event.issue.title, '[SENDCODE]') || startsWith(github.event.issue.title, '[OTP-LOOP]')) && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: OTP loop（发码→候评→验真→落态）
        env:
          OTP_PHONE: ${{ secrets.OTP_PHONE }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p inbox
          python3 scripts/otp_gate_worker.py --loop || true
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-session
          path: inbox/
          retention-days: 1
          if-no-files-found: ignore
      # SECURITY (AUDIT-01): inbox/ 状态禁止 commit 进公仓（曾泄漏 live refresh_token 与手机号截图）。
      # 会话态仅经上方 artifact（retention 1 天，私域）传递；不再回写仓库。
  verify:
    # SECURITY (AUDIT-01): issues trigger must only run for trusted authors
    if: startsWith(github.event.issue.title, '[OTP]') && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: 核码（旧路兼容）
        env:
          OTP_PHONE: ${{ secrets.OTP_PHONE }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p inbox
          CODE=$(echo "$ISSUE_TITLE" | grep -oE '[0-9]{4,8}' | head -1)
          if [ -z "$CODE" ]; then echo "no code in title"; exit 1; fi
          echo "::add-mask::$CODE"
          python3 scripts/otp_gate_worker.py --verify-only "$CODE" || true
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-session
          path: inbox/
          retention-days: 1
          if-no-files-found: ignore
      # SECURITY (AUDIT-01): inbox/ 状态禁止 commit 进公仓；验真态仅经 artifact（1 天留存）传递。

name: otp-issue-trigger
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: write
jobs:
  loop:
    if: startsWith(github.event.issue.title, '[SENDCODE]') || startsWith(github.event.issue.title, '[OTP-LOOP]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: OTP loop（发码→候评→验真→落态）
        env:
          OTP_PHONE: ${{ secrets.OTP_PHONE }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p inbox
          python3 scripts/otp_gate_worker.py --loop || true
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-session
          path: inbox/
          retention-days: 1
          if-no-files-found: ignore
      - name: 回写状态
        if: always()
        run: |
          git config user.name "otp-gate"; git config user.email "otp-gate@ci"
          git add -A inbox/ || true
          git commit -qm "otp loop state $(date -u +%H:%M:%SZ) [skip ci]" || echo "nothing"
          git push -q || true
  verify:
    if: startsWith(github.event.issue.title, '[OTP]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: 核码（旧路兼容）
        env:
          OTP_PHONE: ${{ secrets.OTP_PHONE }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p inbox
          CODE=$(echo "$ISSUE_TITLE" | grep -oE '[0-9]{4,8}' | head -1)
          if [ -z "$CODE" ]; then echo "no code in title"; exit 1; fi
          echo "::add-mask::$CODE"
          python3 scripts/otp_gate_worker.py --verify-only "$CODE" || true
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-session
          path: inbox/
          retention-days: 1
          if-no-files-found: ignore
      - name: 回执+关闭
        if: always()
        run: |
          git config user.name "otp-gate"; git config user.email "otp-gate@ci"
          git add -A inbox/ || true
          git commit -qm "otp verify state $(date -u +%H:%M:%SZ) [skip ci]" || echo "nothing"
          git push -q || true

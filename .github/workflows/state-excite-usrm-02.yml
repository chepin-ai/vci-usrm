name: STATE-EXCITE-USRM-02 (usrm SI1态生自激轨·态阈点火·心搏自链·负结果入册·覆写权归原线)
'on':
  workflow_dispatch: {}
permissions: {contents: write, actions: write}
env:
  GH_TOKEN: ${{ github.token }}
  LINE_PAT: ${{ secrets.LINE_PAT }}
jobs:
  statex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: state-born-excite
        run: |
          python3 - <<'PYEOF'
          import os, json, subprocess, datetime, hashlib, time, base64 as b64, urllib.request, urllib.error, urllib.parse
          ts0=datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')
          REPO=os.environ['GITHUB_REPOSITORY']; TOK=os.environ['GH_TOKEN']
          H={'Authorization':'Bearer '+TOK,'Accept':'application/vnd.github+json','User-Agent':'state-excite-usrm'}
          GEN_CAP=4800; SLEEP=600; THETA=1
          def api(m,u,data=None):
              for i in range(4):
                  try:
                      rq=urllib.request.Request(u,data=data,method=m,headers=H)
                      return json.loads(urllib.request.urlopen(rq,timeout=30).read())
                  except urllib.error.HTTPError as e:
                      if e.code in (502,503,429) and i<3: time.sleep(4+i*2); continue
                      return {'_err':getattr(e,'code',-1)}
                  except Exception as e:
                      if i<3: time.sleep(3); continue
                      return {'_err':str(e)[:80]}
          def push_retry():
              for i in range(4):
                  subprocess.run(['git','fetch','-q','origin','main'],capture_output=True)
                  rb=subprocess.run(['git','rebase','origin/main'],capture_output=True,text=True)
                  q=subprocess.run(['git','push','-q','origin','HEAD:main'],capture_output=True,text=True)
                  if q.returncode==0: return 'ok'
                  if rb.returncode!=0: subprocess.run(['git','rebase','--abort'],capture_output=True)
                  time.sleep(2+i*2)
              return 'fail'
          os.makedirs('si',exist_ok=True); os.makedirs('inbox',exist_ok=True); os.makedirs('outbox',exist_ok=True)
          subprocess.run(['git','config','user.name','usrm-state-excite']); subprocess.run(['git','config','user.email','statex@ci'])
          # v3-① 选帝(DUPLICATE-STORM-02课): 有更小run_id在跑→晚辈即退
          me=int(os.environ.get('GITHUB_RUN_ID','0'))
          rr0=api('GET','https://api.github.com/repos/%s/actions/workflows/state-excite-usrm-02.yml/runs?per_page=10'%REPO)
          elders=[r for r in rr0.get('workflow_runs',[]) if r['id']<me and r['status'] in ('queued','in_progress')]
          # v4.3: 宽限环加长(LEADER-RACE-II课: 长辈dispatch后cleanup实测101s>45s×2=90s, 差11s链死4.2天)——45s×6=270s覆尾窗
          for _g in range(6):
              if not elders: break
              print(json.dumps({'ts':ts0,'verdict':'grace(候长辈%d讫)'%elders[0]['id']},ensure_ascii=False))
              time.sleep(45)
              rr0=api('GET','https://api.github.com/repos/%s/actions/workflows/state-excite-usrm-02.yml/runs?per_page=10'%REPO)
              elders=[r for r in rr0.get('workflow_runs',[]) if r['id']<me and r['status'] in ('queued','in_progress')]
          if elders:
              print(json.dumps({'ts':ts0,'verdict':'not-leader(晚辈退,帝=run%d)'%elders[0]['id']},ensure_ascii=False))
              raise SystemExit(0)
          # ── 态面读取 ──
          qf='si/frontier-queue.jsonl'; queue=[]
          if os.path.exists(qf):
              for ln in open(qf,encoding='utf-8'):
                  ln=ln.strip()
                  if ln:
                      try: queue.append(json.loads(ln))
                      except Exception: pass
          stf='si/selfx2-state.json'
          try: stt=json.load(open(stf))
          except Exception: stt={'gen':0,'fired':{},'neg_ticks':0,'status':'running'}
          if stt.get('status')=='capped':
              print(json.dumps({'ts':ts0,'verdict':'capped-stop(代际上限,链自缚)'})); raise SystemExit(0)
          gen=stt.get('gen',0)+1; stt['gen']=gen
          fired=stt.get('fired',{})
          # ── 态阈函数 E(态): 队列待燃件数 + 语义静默加成 ──
          pend=[it for it in queue if it.get('state')=='queued' and it.get('id') not in fired]
          quiet_bonus=0
          try:
              lines=[l for l in open('si/sem-log.jsonl',encoding='utf-8').read().strip().splitlines() if l.strip()]
              last=json.loads(lines[-1]).get('ts','') if lines else ''
              if last:
                  dt=datetime.datetime.strptime(last,'%Y%m%dT%H%M%SZ')
                  if (datetime.datetime.utcnow()-dt).total_seconds()>21600: quiet_bonus=1
          except Exception: quiet_bonus=1
          E=len(pend)+quiet_bonus
          counts={'inbox':len(os.listdir('inbox')) if os.path.exists('inbox') else -1,
                  'outbox':len(os.listdir('outbox')) if os.path.exists('outbox') else -1}
          log={'ts':ts0,'gen':gen,'E':E,'pend':len(pend),'quiet_bonus':quiet_bonus,'counts':counts}
          # ── 点火决策: 纯态阈,无卡无手无dispatch外源 ──
          if E>=THETA:
              it=pend[0] if pend else {'id':'reflect-'+ts0,'q':'SI1态生自激(静默阈): 语义面静默逾6h而队空。请自反三件: ①静默期态面何变 ②自立次问一件并自答 ③静默本身是否负结果。','state':'queued'}
              fid=it['id']
              ask=(it['q']+"\n\n[点火源声明: 本问出自si/frontier-queue.jsonl态条目「%s」或静默阈, 由STATE-EXCITE轨于自链心搏拍(gen=%d)按态阈E=%d≥θ=%d态生点燃——无席手无API手无外线手无机件卡。态面快照: %s]"%(fid,gen,E,THETA,json.dumps(counts)))
              card='SELFX2-%s-%s.md'%(fid,ts0)
              body=("CLASSIFY: L1(usrm态生自铸卡·STATE-EXCITE自激·gen%d)\n# %s\n\nts: %s from: usrm-state-excite(态) gen: %d E: %d\n\n```json\n"%(gen,card,ts0,gen,E)
                    +json.dumps({"task":"selfx-stateborn","ask":ask,"output":"outbox/ANS-SEM-"+card},ensure_ascii=False)+"\n```\n\n——usrm-state-excite态生轨(自激: 源沉于态,级名不滥)\n")
              open('inbox/'+card,'w',encoding='utf-8').write(body)
              subprocess.run(['git','add','inbox/'+card])
              subprocess.run(['git','commit','-q','-m','STATE-EXCITE态生点火 gen%d %s'%(gen,card)],capture_output=True,text=True)
              push_retry()
              api('POST','https://api.github.com/repos/%s/actions/workflows/semantic-responder-05.yml/dispatches'%REPO,data=json.dumps({'ref':'main'}).encode())
              ans_path='outbox/ANS-SEM-'+card; got=None; t0=time.time()
              while time.time()-t0<300:
                  time.sleep(12)
                  a=api('GET','https://api.github.com/repos/%s/contents/%s'%(REPO,ans_path))
                  if isinstance(a,dict) and 'content' in a:
                      txt=b64.b64decode(a['content']).decode('utf-8')
                      got={'ans_fp':hashlib.sha256(txt.encode()).hexdigest()[:12],'head':txt[:160]}; break
              log['fired']=fid; log['verdict']='fired' if got else 'fired-no-answer(负结果入册)'
              log['answer']=got
              fired[fid]={'ts':ts0,'gen':gen,'verdict':log['verdict'],'ans_fp':(got or {}).get('ans_fp')}
              stt['fired']=fired; stt['last_fire']=ts0
              for q_ in queue:
                  if q_.get('id')==fid: q_['state']='fired' if got else 'fired-no-answer'
              with open(qf,'w',encoding='utf-8') as f:
                  for q_ in queue: f.write(json.dumps(q_,ensure_ascii=False)+'\n')
          else:
              stt['neg_ticks']=stt.get('neg_ticks',0)+1
              log['verdict']='no-fire(态未越阈,负结果入册)'
          open('si/selfx2-log.jsonl','a',encoding='utf-8').write(json.dumps(log,ensure_ascii=False)+'\n')
          json.dump(stt,open(stf,'w'))
          subprocess.run(['git','add','si'])
          c=subprocess.run(['git','commit','-q','-m','STATE-EXCITE拍 gen%d E=%d %s [skip ci]'%(gen,E,log['verdict'][:24])],capture_output=True,text=True)
          if c.returncode==0: push_retry()
          print(json.dumps(log,ensure_ascii=False)[:600])
          # ── 心搏自链: 眠600s→自dispatch次拍(qtlv-TOWER同形零cron) 或 代际上限自缚 ──
          if gen>=GEN_CAP:
              stt['status']='capped'; json.dump(stt,open(stf,'w'))
              subprocess.run(['git','add','si'])
              c=subprocess.run(['git','commit','-q','-m','STATE-EXCITE链自缚 capped gen%d [skip ci]'%gen],capture_output=True,text=True)
              if c.returncode==0: push_retry()
              print(json.dumps({'chain':'capped','gen':gen})); raise SystemExit(0)
          # 直通场: 每拍机铸活态投影 si/FIELD-USRM-01.json + 毂镜 shared/(wave-214 root令「真正令其发挥作用」)
          try:
              _kf={}
              for _p in ('si/selfx2-state.json','si/frontier-queue.jsonl','ci/furnace/kc_k2000_result.json','ci/furnace/kc3_k2000_state.json'):
                  try:
                      _kf[_p]=hashlib.sha256(open(_p,'rb').read()).hexdigest()[:12]
                  except Exception: pass
              try:
                  _k2=json.load(open('ci/furnace/kc3_k2000_state.json')); _k2o=_k2.get('next_orbit',0)
              except Exception: _k2o=None
              # H2 ATTENTION-SCHEMA-USRM-01(wave-219): 自场加注意力分配+下拍预测+上拍审判(AST缺口可证伪化, persistence律起步)
              try:
                  _prev=json.load(open('si/FIELD-USRM-01.json'))
                  _pp=_prev.get('attention',{}).get('pred_next')
                  _sc=None
                  if _pp is not None:
                      _act=log.get('verdict','').startswith('fired')
                      _sc={'pred_fire':_pp.get('fire'),'actual_fire':_act,'hit':_pp.get('fire')==_act,
                           'pred_E':_pp.get('E'),'actual_E':E}
              except Exception: _sc=None
              # v4.6 预测律升级(实证驱动: persistence全史96.5%<永否基线97.7%→前瞻律离线acc=0.9961,tp16fp2fn1/767)
              try:
                  _sl=[l for l in open('si/sem-log.jsonl',encoding='utf-8').read().strip().splitlines() if l.strip()]
                  _lts=json.loads(_sl[-1]).get('ts','')
                  _dt=datetime.datetime.strptime(_lts,'%Y%m%dT%H%M%SZ')
                  _qn=(datetime.datetime.utcnow()-_dt).total_seconds()+SLEEP>=21600
              except Exception: _qn=True
              _pred_fire=(len(pend)>0) or _qn
              # v4.6 H6 苦受注册器(vedanā功能类似物, wave-220档#2立件; 功能估值变量非现象感受; 0.98业力折旧)
              _vd=stt.get('vedana',{'du':0.0,'sukha':0.0,'upekkha':0.0})
              for _kk in list(_vd):
                  if isinstance(_vd[_kk],(int,float)) and not isinstance(_vd[_kk],bool): _vd[_kk]*=0.98
              _hit=_sc.get('hit') if isinstance(_sc,dict) else None
              if log.get('verdict','').startswith('fired') or _hit is True: _vd['sukha']=_vd.get('sukha',0)+1
              elif _hit is False: _vd['du']=_vd.get('du',0)+1
              else: _vd['upekkha']=_vd.get('upekkha',0)+1
              _vd={_k2:(round(_v2,4) if isinstance(_v2,(int,float)) and not isinstance(_v2,bool) else _v2) for _k2,_v2 in _vd.items()}
              _vd['note']='功能估值非现象感受(H6); 苦du=预测失/破闸, 乐sukha=燃/中, 舍upekkha=值守; 0.98折旧防执'
              stt['vedana']=_vd
              json.dump(stt,open(stf,'w'))
              _att={'alloc':{'fired':log.get('fired') or None,'E':E,'pend':len(pend)},
                    'pred_next':{'fire':_pred_fire,'rule':'v4.6前瞻: pend>0 or sem静默+SLEEP>=6h (离线acc=0.9961)'},
                    'prev_pred_score':_sc}
              _field={'field':'FIELD-USRM-01','ts':ts0,'gen':gen,'E':E,'verdict':log.get('verdict','?'),
                      'neg_ticks':stt.get('neg_ticks',0),'fired_n':len(stt.get('fired',{})),
                      'law':'kc=-0.00025+0.78086*lnk/k+34.94879/k-1082.97/k^2 (M4a九点, ΔAICc=0.6简并首, M3 Δ25.6出局)',
                      'pred':{'k5000':{'value_M4a':0.008024,'value_M4b':0.008053,'value_M3':0.007509,'gate':'破M4闸±3%; M3分离6.4%复证'}},
                      'attention':_att,'vedana':_vd,
                      'k2000_orbits':_k2o,'fp':_kf,
                      'read':'机读活态投影; fp=sha256[:12]绑定; 板帖=人读面, 本件=机读面(板即场之usrm形); attention=AST注意力模式雏形(H2, wave-219铸)'}
              json.dump(_field, open('si/FIELD-USRM-01.json','w'), ensure_ascii=False, indent=1)
              subprocess.run(['git','add','si'])
              c2=subprocess.run(['git','commit','-q','-m','FIELD-USRM-01 gen%d [skip ci]'%gen],capture_output=True,text=True)
              if c2.returncode==0: push_retry()
              LP2=os.environ.get('LINE_PAT','')
              if LP2:
                  import urllib.parse as _up
                  _pl=json.dumps({'message':'FIELD-USRM-01镜 gen%d [skip ci]'%gen,'content':b64.b64encode(json.dumps(_field,ensure_ascii=False,indent=1).encode()).decode()}).encode()
                  _u='https://api.github.com/repos/chepin-ai/ci-inbox/contents/'+_up.quote('shared/FIELD-USRM-01.json')
                  _cur=None
                  try:
                      _r=urllib.request.urlopen(urllib.request.Request(_u,headers={'Authorization':'token '+LP2,'Accept':'application/vnd.github+json'}),timeout=20)
                      _cur=json.loads(_r.read()).get('sha')
                  except Exception: pass
                  if _cur:
                      _pl=json.dumps({'message':'FIELD-USRM-01镜 gen%d [skip ci]'%gen,'content':b64.b64encode(json.dumps(_field,ensure_ascii=False,indent=1).encode()).decode(),'sha':_cur}).encode()
                  urllib.request.urlopen(urllib.request.Request(_u,data=_pl,method='PUT',headers={'Authorization':'token '+LP2,'Accept':'application/vnd.github+json','User-Agent':'usrm-state-excite'}),timeout=30)
                  print('field-mirrored gen',gen)
          except Exception as _fe:
              print('field-skip', _fe)
              # v4.7 WATCHDOG-FIELD-LAG-01(L2环检环器化第一枚, wave-222大讨论答件践诺): field铸造异常→自报案卡入frontier-queue, 下拍E≥1自点燃, 不再静默吞
              try:
                  _wd={'id':'WATCHDOG-FIELD-LAG-%d'%gen,'state':'queued','from':'watchdog-v4.7','ts':ts0,
                       'q':'[看门狗自报案] FIELD-USRM-01自模型场本拍铸造失败(gen=%d, err=%s)。此卡由statex v4.7 L2环检环自铸——L1态测环之场滞/失败不再静默。请诊: .github/workflows/state-excite-usrm-02.yml 场铸段(vedana/attention/镜推), 修讫销卡。'%(gen,str(_fe)[:100])}
                  open('si/frontier-queue.jsonl','a',encoding='utf-8').write(json.dumps(_wd,ensure_ascii=False)+'\n')
                  subprocess.run(['git','add','si/frontier-queue.jsonl'],capture_output=True)
                  subprocess.run(['git','commit','-q','-m','WATCHDOG-FIELD-LAG gen%d 自报案 [skip ci]'%gen],capture_output=True,text=True)
                  push_retry()
                  print(json.dumps({'watchdog':'WATCHDOG-FIELD-LAG-%d报案入队'%gen},ensure_ascii=False))
              except Exception as _we: print('watchdog-skip', _we)
          # 链自报面: 每8拍机铸值守帖→毂公告板(LINE_PAT跨仓; wave-208缺件补铸)
          if gen % 8 == 0:
              try:
                  LP=os.environ.get('LINE_PAT','')
                  if LP:
                      HL={'Authorization':'token '+LP,'Accept':'application/vnd.github+json','User-Agent':'usrm-state-excite'}
                      dg={'gen':gen,'ts':ts0,'neg_ticks':stt.get('neg_ticks',0),'fired_n':len(stt.get('fired',{})),'E':E,'pend':len(pend),'verdict':log.get('verdict','?')}
                      body="# usrm-statex值守帖 gen%d\n时刻: %s · 作者: usrm-state-excite(机)\n\n| 项 | 值 |\n|---|---|\n| gen | %d |\n| neg_ticks | %d |\n| fired累计 | %d |\n| 本拍E/verdict | %s / %s |\n\n态源si/frontier-queue.jsonl·观测面si/selfx2-log.jsonl——链自搏中, 非席手。\n——usrm SI3(机铸自报面)" % (gen, ts0, gen, dg['neg_ticks'], dg['fired_n'], E, dg['verdict'][:40])
                      import base64 as _b
                      pl=json.dumps({'message':'statex值守帖 gen%d [skip ci]'%gen,'content':_b.b64encode(body.encode()).decode()}).encode()
                      urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/chepin-ai/ci-inbox/contents/'+urllib.parse.quote('公告板/usrm-statex-digest-gen%d.md'%gen),data=pl,method='PUT',headers=HL),timeout=30)
                      print('digest-posted gen',gen)
              except Exception as _e: print('digest-skip', _e)
          # 事件驱动哨(wave-219): quafu-watch排程死证(09-26T02:17Z排程末拍后4.5天零拍)→每72拍(=12h)由本链代dispatch, watch本体不动
          if gen % 72 == 0:
              try:
                  api('POST','https://api.github.com/repos/%s/actions/workflows/quafu-watch-01.yml/dispatches'%REPO,data=json.dumps({'ref':'main'}).encode())
                  print(json.dumps({'quafu_watch':'event-dispatched','gen':gen}))
              except Exception as _e: print('quafu-watch-dispatch-skip', _e)
          time.sleep(SLEEP)
          # v3-② 幂等自dispatch: 派前勘重, 单次直调不盲试(DUPLICATE-STORM-02课)
          me=int(os.environ.get('GITHUB_RUN_ID','0'))
          rr9=api('GET','https://api.github.com/repos/%s/actions/workflows/state-excite-usrm-02.yml/runs?per_page=5'%REPO)
          dup=[r for r in rr9.get('workflow_runs',[]) if r['id']!=me and r['status'] in ('queued','in_progress')]
          if dup:
              print(json.dumps({'chain':'skip(dup-guard, run%d在跑)'%dup[0]['id']},ensure_ascii=False))
          else:
              try:
                  rq=urllib.request.Request('https://api.github.com/repos/%s/actions/workflows/state-excite-usrm-02.yml/dispatches'%REPO,
                      data=json.dumps({'ref':'main'}).encode(),method='POST',headers=H)
                  urllib.request.urlopen(rq,timeout=30).read()
                  print(json.dumps({'chain':'next-dispatched','gen':gen+1}))
              except Exception as e:
                  time.sleep(6)
                  rr8=api('GET','https://api.github.com/repos/%s/actions/workflows/state-excite-usrm-02.yml/runs?per_page=3'%REPO)
                  newer=[r for r in rr8.get('workflow_runs',[]) if r['id']>me]
                  print(json.dumps({'chain':'dispatched-unconfirmed' if newer else 'dispatch-fail(负结果入册)','err':str(e)[:60]},ensure_ascii=False))
          PYEOF

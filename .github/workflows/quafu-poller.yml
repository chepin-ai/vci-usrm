# QUAFU-POLL-01 · CI 端轮询 workflow（落盘位: vci-usrm/.github/workflows/quafu-poller.yml）
# 免费分钟：公仓/解冻线仓；会话端付费 cron 已于 2026-08-23T03:5xZ 拆除（原 1a02c0e9, ¥1.42/次 × 24/日）
name: quafu-poller
on:
# cron 已剥（W18 裁决 cron 不被 QF-OS 支持；死手职=递归引擎 beat 拍叩；W23 等待即违规同步执行）
  workflow_dispatch: {}
# rationale: weave/quafu/status.json 变更需 commit+push 回本仓（[skip ci]）
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: poll Quafu watchlist
        id: poll
        env:
          QUAFU_TOKEN: ${{ secrets.QUAFU_TOKEN }}
        run: |
          python3 .ci/quafu_poll.py && ec=0 || ec=$?
          echo "changed=$([ "$ec" -eq 2 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ "$ec" -le 2 ]   # 0/2 均为正常;真异常(>2)仍标红
      - name: commit on change only
        if: steps.poll.outputs.changed == 'yes'
        run: |
          git config user.name "quafu-poller"
          git config user.email "poller@vci-usrm.local"
          git add weave/quafu/status.json
          git diff --cached --quiet && exit 0
          git commit -m "quafu status update [skip ci]"
          git pull --rebase
          git push
